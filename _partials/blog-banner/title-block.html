<header id="title-block-header" class="blog-banner"$if(image)$ style="background-image: linear-gradient(rgba(15,26,41,.78), rgba(15,26,41,.78)), url('$image$');"$endif$>
$if(categories)$
<p class="banner-tags">
$for(categories)$<span class="tag banner-tag">$categories$</span>$endfor$
</p>
$endif$
$if(title)$<h1 class="title">$title$</h1>$endif$
$if(subtitle)$
<p class="subtitle">$subtitle$</p>
$endif$
<p class="banner-meta">
$for(author)$$author$$endfor$$if(date)$ &middot; $date$$endif$
</p>
</header>
