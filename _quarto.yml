  site-url: https://elbadisyimad.com
  favicon: favicon.svg
  description: "Imad El Badisy, Research Engineer in Health Data Science, PhD."
  page-navigation: true
  back-to-top-navigation: true
  open-graph:
    locale: en_US
    site-name: "Imad El Badisy"
  twitter-card: true

  navbar:
    title: "Imad El Badisy"
    tools:
    - icon: github
      href: https://github.com/ielbadisy
    right:
      - text: Background
