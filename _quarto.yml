format:
  html:
    theme:
      dark:
        - cosmo
        - assets/imad-theme-dark.scss
        - assets/imad/colors-dark.scss
        - assets/imad/fonts.scss
      light:
        - cosmo
        - assets/imad-theme-light.scss
        - assets/imad/colors-light.scss
        - assets/imad/fonts.scss
    css: assets/overrides.css
    toc: false
    smooth-scroll: true
    anchor-sections: true
    html-math-method: mathjax
    code-link: true
    pagetitle: "{{< meta title >}}"
    lightbox: true

execute:
  freeze: auto
