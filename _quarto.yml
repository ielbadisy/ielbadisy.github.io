      - text: Teaching
        aria-label: "Teaching"
        href: teaching.qmd
      - text: Software
        aria-label: "Software"
        href: packages.qmd
      - text: Publications
        aria-label: "Publications"
        href: publications.qmd
      - text: Notes
        aria-label: "Notes"
